<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Северный завоз · сеть</title>
<style>
:root{
  color-scheme:light;
  --page:#eef0f2; --surface:#ffffff; --surface2:#f6f7f8; --border:#dfe2e6; --grid:#eceef1;
  --text:#0f1720; --text2:#4b5563; --muted:#8a919b;
  --land:#f7f6f2; --sea:#dfe9f2; --coast:#b9c9d8; --river:#a9c3dc; --river-bg:#c7d6e4;
  --accent:#1f6fd1; --accent-soft:#e3eefb; --accent-ink:#fff;
  --ok:#12955f; --limit:#e19a00; --closed:#9aa1aa; --bad:#d23f3f; --seaway:#3a7fc4;
  --load:#e19a00; --sail:#1f6fd1; --unload:#12955f; --empty:#7b5cd6; --wait:#8a919b; --idle:#b4bac2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d1117; --surface:#151b23; --surface2:#1b222c; --border:#2a323d; --grid:#222a34;
    --text:#e8edf2; --text2:#aab4bf; --muted:#7d8792;
    --land:#161b21; --sea:#0b1e33; --coast:#2c4a66; --river:#3d6a96; --river-bg:#25425f;
    --accent:#4c93ea; --accent-soft:#16273d; --accent-ink:#06101c;
    --ok:#2bb47a; --limit:#e0a520; --closed:#5d6670; --bad:#e46161; --seaway:#5aa0e6;
    --load:#e0a520; --sail:#4c93ea; --unload:#2bb47a; --empty:#9a83ec; --wait:#7d8792; --idle:#4b545e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d1117; --surface:#151b23; --surface2:#1b222c; --border:#2a323d; --grid:#222a34;
  --text:#e8edf2; --text2:#aab4bf; --muted:#7d8792;
  --land:#161b21; --sea:#0b1e33; --coast:#2c4a66; --river:#3d6a96; --river-bg:#25425f;
  --accent:#4c93ea; --accent-soft:#16273d; --accent-ink:#06101c;
  --ok:#2bb47a; --limit:#e0a520; --closed:#5d6670; --bad:#e46161; --seaway:#5aa0e6;
  --load:#e0a520; --sail:#4c93ea; --unload:#2bb47a; --empty:#9a83ec; --wait:#7d8792; --idle:#4b545e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
/* верхняя панель */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:14px;line-height:1.15;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--text2);white-space:nowrap;line-height:1.2;text-align:left}
.seg button small{display:block;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.seg button .star{color:var(--ok);font-size:11px;margin-left:3px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:6px 8px;min-width:32px}
select.btn{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
/* основная область */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--land)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.float{position:absolute;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.kpis{top:12px;left:12px;display:flex;gap:0;padding:0;overflow:hidden;max-width:calc(100% - 90px)}
.kpi{padding:8px 14px;border-right:1px solid var(--border);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11px;color:var(--muted);white-space:nowrap}
.kpi .v{font-size:18px;font-weight:650;line-height:1.2;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:500;color:var(--text2)}
.kpi .s{font-size:11px;color:var(--text2);white-space:nowrap}
.zoom{top:12px;right:12px;display:flex;flex-direction:column;padding:3px;gap:2px}
.zoom button{border:0;background:transparent;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;color:var(--text2)}
.zoom button:hover{background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:6px 14px;font-size:12px;color:var(--text2);background:var(--surface);border-top:1px solid var(--border)}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.legend .ln{width:22px;height:4px;border-radius:2px}
.legend b{font-weight:600;color:var(--text);margin-right:2px}
.legend .toggle{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;justify-self:start}
.attrib{right:12px;bottom:8px;padding:3px 8px;font-size:11px;color:var(--muted);max-width:50%;border-radius:6px}
.tip{position:absolute;pointer-events:none;z-index:20;padding:8px 10px;font-size:12px;max-width:280px;display:none}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip .k{color:var(--muted)}
/* шкала времени */
.timeline{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 14px 10px;background:var(--surface);border-top:1px solid var(--border)}
.date{font-weight:650;font-size:14px;min-width:120px}
.date small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.track{position:relative;height:42px}
#spark{position:absolute;inset:0 0 14px 0;width:100%;height:28px}
#slider{position:absolute;left:0;right:0;bottom:0;width:100%;margin:0;accent-color:var(--accent)}
.months{position:absolute;left:0;right:0;top:28px;height:0;font-size:10px;color:var(--muted)}
.months span{position:absolute;transform:translateX(-50%);top:-2px;pointer-events:none}
/* боковая панель */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--surface);border-left:1px solid var(--border);min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:8px 9px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs button .cnt{color:var(--muted);font-size:11px;margin-left:3px}
.pane{overflow:auto;padding:12px 14px 18px;min-height:0}
.pane h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:16px 0 8px}
.pane h3:first-child{margin-top:2px}
.note{color:var(--muted);font-size:12px}
.callout{border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--text2)}
.callout b{color:var(--text)}
.callout.warn{border-color:color-mix(in srgb,var(--bad) 45%,var(--border));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.callout.good{border-color:color-mix(in srgb,var(--ok) 45%,var(--border));background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);vertical-align:middle}
.badge.stub{background:color-mix(in srgb,var(--limit) 14%,var(--surface));border-color:color-mix(in srgb,var(--limit) 45%,var(--border));color:var(--text)}
.badge.ok{color:var(--ok)} .badge.bad{color:var(--bad)}
.cmp{display:grid;gap:7px}
.cmp .r{display:grid;grid-template-columns:104px minmax(0,1fr) 62px;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:6px}
.cmp .r:hover{background:var(--surface2)}
.cmp .r.on{background:var(--accent-soft)}
.cmp .name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .bar{height:10px;border-radius:5px;background:var(--grid);position:relative;overflow:hidden}
.cmp .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.cmp .bar i.tot{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.cmp .val{text-align:right;font-size:12px}
.list{display:grid;gap:4px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--surface2)}
.item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{font-size:12px;text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.prog{height:5px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:4px;display:flex}
.prog i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.card+.card{margin-top:10px}
.card .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card .hd b{font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.kv dd.na{color:var(--muted);font-style:italic}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--border)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--grid)}
table.t td.n,table.t th.n{text-align:right}
.fin{display:grid;gap:6px}
.fin .r{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12.5px}
.fin .bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.fin .bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:24px;font-weight:650;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.mini .l{font-size:11px;color:var(--muted)} .mini .v{font-size:16px;font-weight:650}
/* загрузка */
.drop{border:1.5px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--text2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--page) 60%,transparent);z-index:30}
.overlay.on{display:grid}
.overlay .box{padding:16px 20px;display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* карта */
.lbl{font-size:12px;fill:var(--text);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl.hub{font-weight:650}
.lbl.river{fill:var(--river);stroke:var(--land);font-style:italic;font-size:12px}
.lbl.sea{fill:color-mix(in srgb,var(--seaway) 65%,var(--muted));stroke:none;font-style:italic;letter-spacing:.12em;font-size:13px}
.vlbl{font-size:10.5px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr) 340px}.seg button small{display:none}}
@media (max-width:820px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .stage{height:72vh}
  .side{border-left:0;border-top:1px solid var(--border)}
  .top{flex-wrap:wrap}
  .kpis{order:-1;position:static;margin:0;border-radius:0;border-width:0 0 1px;max-width:none;overflow-x:auto;box-shadow:none}
  .kpi{padding:6px 10px;flex:none}.kpi .v{font-size:15px}
  .seg{max-width:100%;overflow-x:auto}
  .mapwrap{display:flex;flex-direction:column}
  #map{flex:1 1 0;min-height:0;height:auto}
  .legend{display:none}
  .timeline{grid-template-columns:auto minmax(0,1fr) auto}.timeline .date{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 3 2"/><path d="M5 13l2-6h10l2 6"/><path d="M12 3v4"/></svg></div>
      <div><b>Северный завоз</b><span id="subtitle">—</span></div>
    </div>
    <select id="scenarioSel" class="btn" aria-label="Сценарий" hidden></select>
    <div class="spacer"></div>
    <div class="seg" id="strategies" role="group" aria-label="Стратегия"></div>
    <div class="spacer"></div>
    <button class="btn" id="uploadBtn" hidden>Свой сценарий</button>
    <a class="btn" id="dlBtn" hidden download>Скачать v3</a>
    <button class="btn icon" id="themeBtn" title="Тема" aria-label="Переключить тему">◐</button>
  </header>
  <div class="main">
    <div class="stage">
      <div class="mapwrap" id="mapwrap">
        <svg id="map" aria-label="Карта сети"></svg>
        <div class="float kpis" id="kpis"></div>
        <div class="float zoom">
          <button id="zin" title="Приблизить">+</button><button id="zout" title="Отдалить">−</button><button id="zfit" title="Вся сеть" style="font-size:13px">⤢</button>
        </div>
        <div class="float attrib" id="attrib"></div>
        <div class="float tip" id="tip"></div>
        <div class="overlay" id="overlay"><div class="float box" style="position:static"><div class="spin"></div><div id="overlayText">Считаем…</div></div></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="timeline">
        <button class="btn icon" id="play" title="Пуск / пауза" aria-label="Пуск">▶</button>
        <div class="date num" id="date">—</div>
        <div class="track"><svg id="spark" preserveAspectRatio="none"></svg><div class="months" id="months"></div><input type="range" id="slider" min="0" max="100" step="1" value="0" aria-label="Момент времени"></div>
        <select id="speed" class="btn" aria-label="Скорость"><option value="2">2 дня/с</option><option value="5" selected>5 дней/с</option><option value="12">12 дней/с</option></select>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden multiple>
<script>
"use strict";
const D0 = /*__DATA__*/null;
const APP = /*__APP__*/false;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const STATUS = {
  load: {ru: 'Погрузка', c: '--load'}, sail: {ru: 'Идёт с грузом', c: '--sail'}, unload: {ru: 'Выгрузка', c: '--unload'},
  empty: {ru: 'Перегон порожним', c: '--empty'}, back: {ru: 'Возвращается порожним', c: '--empty'}, wait: {ru: 'Ждёт воды/окна', c: '--wait'}, idle: {ru: 'Стоит в порту', c: '--idle'}
};
const CT = {fuel: 'топливо', coal: 'уголь', general: 'генгруз', food: 'продовольствие', concentrate: 'концентрат'};
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_N = ['янв', 'фев', 'март', 'апр', 'май', 'июнь', 'июль', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let D = null, cur = null, T = 0, tab = 'overview', sel = null, playing = false, lastTs = 0, jobId = null;
let view = null, want = null, fitBox = null;
const ui = {fleetFilter: 'all', cargoFilter: 'all'};

/* ---------- время ---------- */
function t0() { return new Date(D.start); }
function at(h) { return new Date(t0().getTime() + h * 3600e3); }
function dstr(h, withTime) {
  const d = at(h);
  const s = d.getDate() + ' ' + MONTHS[d.getMonth()];
  return withTime ? s + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : s;
}
function dayIndex(h) { return Math.max(0, Math.floor((h + t0().getHours() + t0().getMinutes() / 60) / 24)); }

/* ---------- данные стратегии ---------- */
function S() { return D.strategies[cur]; }
function cargoRu(t) { return (D.cargo_types_ru && D.cargo_types_ru[t]) ? D.cargo_types_ru[t].replace(/ \(.*\)/, '') : (CT[t] || t); }
function fleetById(id) { return D.fleet.find(f => f.vessel_id === id); }
function linkById(id) { return D.links[id]; }

function vesselState(id, h) {
  // последнее событие, начавшееся до h
  const ev = S()._byVessel[id] || [];
  let prev = null;
  for (const e of ev) {
    if (e[7] <= h && h < e[8]) return {ev: e, st: e[4], frac: (h - e[7]) / Math.max(1e-6, e[8] - e[7])};
    if (e[8] <= h) prev = e;
  }
  const f = fleetById(id);
  const port = prev ? prev[6] : f.current_port;
  return {ev: null, st: 'idle', port, prev};
}

function prepare() {
  for (const k of Object.keys(D.strategies)) {
    const s = D.strategies[k];
    s._byVessel = {};
    for (const e of s.events) {
      for (const v of [e[1], e[2]]) if (v) (s._byVessel[v] = s._byVessel[v] || []).push(e);
    }
    for (const v in s._byVessel) s._byVessel[v].sort((a, b) => a[7] - b[7]);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-label="Глубина по сезону">
  <rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface2)" rx="5"/>
  <line x1="0" x2="${W}" y1="${yf}" y2="${yf}" stroke="var(--limit)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
  <path d="${d}" fill="none" stroke="var(--river)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <line x1="${xi}" x2="${xi}" y1="0" y2="${H}" stroke="var(--text)" vector-effect="non-scaling-stroke"/></svg>
  <div class="note" style="display:flex;justify-content:space-between"><span>мин. глубина по реке</span><span style="color:var(--limit)">- - нужно для полной загрузки</span></div>`;
}
/* валюта и суммы: тарифы v1/v2 приходят в своей валюте (RUB или условная DEMO) */
function curSign() { const c = (D.tariffs && D.tariffs.currency) || 'RUB'; return c === 'RUB' ? '₽' : c; }
function moneyFmt(v) { return Math.abs(v) >= 1e6 ? `${fmt(v / 1e6, 1)} млн ${curSign()}` : `${fmt(v)} ${curSign()}`; }
function financeHTML() {
  const s = S();
  if (!s.financial) return `<div class="callout">Тарифы не заданы, денежная оценка не считалась. Ядро выдаёт натуральные показатели для финансового расчёта: км в грузу и порожнём, часы работы, простоя и ожидания.</div>` + finInputs(s);
  const f = s.financial, tot = Number(f.total_cost), m = s.metrics;
  const NAMES = {loaded_km: 'Ход с грузом', empty_km: 'Порожний ход', loading_hour: 'Погрузка', unloading_hour: 'Выгрузка', waiting_hour: 'Ожидание', tug_busy_hour: 'Работа буксиров', barge_busy_hour: 'Работа барж',
    loaded_fuel: 'Топливо с грузом', empty_fuel: 'Топливо порожнём', tug_operation: 'Работа буксиров', barge_operation: 'Работа барж', loading: 'Погрузка', unloading: 'Выгрузка', port_call: 'Портовые сборы', waiting: 'Ожидание', repositioning: 'Перегон', alternative_delivery: 'Недовоз: альтернативная доставка'};
  const items = Object.entries(f.cost_by_unit).map(([k, v]) => [k, Number(v)]).sort((a, b) => b[1] - a[1]);
  const mx = Math.max(...items.map(i => i[1]), 1);
  let h = `<div class="callout" style="margin-bottom:10px"><span class="badge stub">заглушка</span> Ставки условные (${esc(f.source_status)}). Когда появится финансовое ядро, сюда придут его ставки и статьи; расчёт и формат не поменяются.</div>
  <div class="grid2"><div class="mini"><div class="l">Стоимость сезона</div><div class="v num">${moneyFmt(tot)}</div></div><div class="mini"><div class="l">За тонну в срок</div><div class="v num">${fmt(tot / Math.max(1, m.delivered_on_time_t))} ${curSign()}</div></div></div>
  <h3>Статьи затрат</h3><div class="fin">${items.map(([k, v]) => `<div class="r"><span>${NAMES[k] || k}</span><div class="bar"><i style="width:${100 * v / mx}%"></i></div><span class="num" style="text-align:right">${moneyFmt(v)}</span></div>`).join('')}</div>
  <h3>Сравнение стратегий</h3><table class="t"><tr><th>Стратегия</th><th class="n">в срок, т</th><th class="n">стоимость</th><th class="n">${curSign()}/т</th></tr>${D.order.map(k => { const q = D.strategies[k]; const c = q.financial ? Number(q.financial.total_cost) : null; return `<tr${k === cur ? ' style="font-weight:600"' : ''}><td>${esc(q.label)}</td><td class="n num">${fmt(q.metrics.delivered_on_time_t)}</td><td class="n num">${c == null ? '—' : moneyFmt(c)}</td><td class="n num">${c == null ? '—' : fmt(c / Math.max(1, q.metrics.delivered_on_time_t))}</td></tr>`; }).join('')}</table>
  <p class="note">${D._linear ? 'Порожний ход — возврат состава после каждого рейса.' : 'План с перегоном дороже в рублях, но каждая доставленная в срок тонна обходится по-разному.'} ${f.undelivered_penalty != null ? 'Недовоз оценён по тарифу альтернативной доставки (зимник, авиация).' : 'Цена недовоза (зимник, авиация) появится с финансовым ядром.'}</p>`;
  return h + finInputs(s);
}
function finInputs(s) {
  const t = s.financial_totals;
  return `<h3>Натуральные показатели (вход финансового ядра)</h3><dl class="kv">
  <dt>Ход с грузом</dt><dd class="num">${fmt(t.loaded_km)} км</dd><dt>Порожний ход</dt><dd class="num">${fmt(t.empty_km)} км</dd>
  <dt>Транспортная работа</dt><dd class="num">${fmt(t.tonne_km / 1e6, 2)} млн т·км</dd><dt>В пути</dt><dd class="num">${fmt(t.transit_seconds / 3600)} ч</dd>
  <dt>Погрузка + выгрузка</dt><dd class="num">${fmt((t.loading_seconds + t.unloading_seconds) / 3600)} ч</dd><dt>Ожидание</dt><dd class="num">${fmt(t.waiting_seconds / 3600)} ч</dd>
  <dt>Не довезено</dt><dd class="num">${fmt(t.undelivered_t)} т</dd></dl>`;
}
function bindSide() {
  const pane = $('#pane');
  pane.querySelectorAll('[data-s]').forEach(n => n.onclick = () => setStrategy(n.dataset.s));
  pane.querySelectorAll('[data-v]').forEach(n => n.onclick = () => selectVessel(n.dataset.v));
  pane.querySelectorAll('[data-back]').forEach(n => n.onclick = () => { sel = null; renderSide(); renderMap(); });
  pane.querySelectorAll('[data-ff]').forEach(n => n.onclick = () => { ui.fleetFilter = n.dataset.ff; renderSide(); });
  pane.querySelectorAll('[data-cf]').forEach(n => n.onclick = () => { ui.cargoFilter = n.getAttribute('aria-pressed') === 'true' && n.dataset.cf.startsWith('port:') ? 'all' : n.dataset.cf; renderSide(); });
  pane.querySelectorAll('[data-c]').forEach(n => n.onclick = () => {
    const c = D.cargo.find(x => x.cargo_id === n.dataset.c);
    sel = sel && sel.type === 'cargo' && sel.id === c.cargo_id ? null : {type: 'cargo', id: c.cargo_id, from: c.origin_port, to: c.destination_port};
    renderSide(); renderMap();
  });
  pane.querySelectorAll('[data-r]').forEach(n => n.onclick = () => {
    const r = n.dataset.r; sel = sel && sel.type === 'river' && sel.id === r ? null : {type: 'river', id: r};
    renderSide(); renderMap(); if (sel) zoomTo(D.links.filter(l => l.river === r));
  });
}
function selectVessel(id) {
  sel = sel && sel.type === 'vessel' && sel.id === id ? null : {type: 'vessel', id};
  tab = 'fleet'; renderSide(); renderMap();
}
function zoomTo(links) {
  const pts = links.flatMap(l => linkXY(l)).map(p => [p[0], -p[1]]);
  if (!pts.length) return;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = Math.max(80, (Math.max(...xs) - Math.min(...xs)) * .15);
  want = [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + 2 * pad, Math.max(...ys) - Math.min(...ys) + 2 * pad];
  applyView();
}

/* ---------- легенда ---------- */
let legendOpen = true;
function renderLegend() {
  $('#legend').innerHTML = legendOpen ? `
  <div class="row"><b>Участок:</b><span><i class="ln" style="background:var(--ok)"></i>полная загрузка</span><span><i class="ln" style="background:var(--limit)"></i>с недогрузом</span><span><i class="ln" style="background:repeating-linear-gradient(90deg,var(--closed) 0 4px,transparent 4px 7px)"></i>закрыт</span><span><i class="ln" style="background:repeating-linear-gradient(90deg,var(--seaway) 0 7px,transparent 7px 10px)"></i>море</span></div>
  <div class="row"><b>Подложка:</b><span><i class="ln" style="height:7px;background:color-mix(in srgb,var(--accent) 35%,transparent)"></i>чем толще, тем больше тонн провезено</span></div>
  <div class="row"><b>${D && D._linear ? 'Состав' : 'Буксир'}:</b>${Object.entries(STATUS).filter(([k]) => !D || D._states.has(k)).map(([k, s]) => `<span><i style="width:9px;height:9px;border-radius:${k === 'sail' || k === 'empty' || k === 'back' ? '50%' : '2px'};background:${k === 'empty' || k === 'back' || k === 'idle' ? 'transparent' : `var(${s.c})`};border:1.6px solid var(${s.c})"></i>${s.ru.toLowerCase()}</span>`).join('')}</div>
  <button class="toggle" id="legT" title="Скрыть">✕</button>` : `<button class="toggle" id="legT">Показать легенду</button>`;
  $('#legT').onclick = () => { legendOpen = !legendOpen; renderLegend(); };
}

/* ---------- стратегии и верх ---------- */
function setStrategy(k) {
  cur = k; sel = sel && sel.type === 'vessel' ? sel : null;
  for (const b of $('#strategies').children) b.setAttribute('aria-pressed', b.dataset.s === k);
  if (jobId) { $('#dlBtn').href = `/api/network/jobs/${jobId}/result/${k}`; $('#dlBtn').hidden = false; }
  placeLabels(); renderMap(); renderSide();
}
function renderTop() {
  $('#subtitle').textContent = `${D.title} · ${D.ports.length} портов · ${fmt(D.links.reduce((a, l) => a + l.km, 0))} км сети · ${D.data_status === 'SYNTHETIC' ? 'синтетика' : D.data_status}`;
  $('#strategies').innerHTML = D.order.map(k => {
    const s = D.strategies[k];
    return `<button data-s="${k}" aria-pressed="${k === cur}" title="${esc(s.hint)}">${esc(s.label)}${k === D.best ? '<span class="star">★</span>' : ''}<small class="num">${pct(s.metrics.delivered_on_time_t, s.metrics.demand_t)}% в срок</small></button>`;
  }).join('');
  for (const b of $('#strategies').children) b.onclick = () => setStrategy(b.dataset.s);
  $('#attrib').textContent = D.geo.source ? (D.geo.source.split(';')[0]) : '';
}
function load(data) {
  D = data; prepare();
  cur = D.best; sel = null; tab = 'overview';
  $('#slider').max = Math.round(D.horizon_h); $('#slider').step = 6;
  renderTop(); buildMap(); renderMonths(); renderLegend();
  // стартовый момент: середина июля, если есть, иначе начало
  const mid = D.horizon_h * .35;
  setT(D.horizon_h > 24 * 60 ? mid : 0);
  renderSide();
}

/* ---------- управление картой ---------- */
let drag = null;
map.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, v: view.slice(), moved: false}; map.setPointerCapture(e.pointerId); });
map.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = scale(), dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2 * k) { drag.moved = true; map.classList.add('drag'); hideTip(); }
  view = [drag.v[0] - dx, drag.v[1] - dy, view[2], view[3]];
  want = view.slice();
  map.setAttribute('viewBox', view.join(' '));
});
map.addEventListener('pointerup', e => { if (drag && !drag.moved && e.target === map) { /* клик по пустому месту */ } drag = null; map.classList.remove('drag'); });
map.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 0.8 : 1.25, e); }, {passive: false});
function zoom(f, e) {
  const r = map.getBoundingClientRect();
  const px = e ? (e.clientX - r.left) / r.width : .5, py = e ? (e.clientY - r.top) / r.height : .5;
  const w = Math.min(fitBox[2] * 4, Math.max(40, view[2] * f));
  const ff = w / view[2];
  const h = view[3] * ff;
  view = [view[0] + (view[2] - w) * px, view[1] + (view[3] - h) * py, w, h];
  want = view.slice();
  map.setAttribute('viewBox', view.join(' '));
  placeLabels(); renderMap();
}
$('#zin').onclick = () => zoom(.7); $('#zout').onclick = () => zoom(1.4); $('#zfit').onclick = () => { want = fitBox.slice(); applyView(); };
window.addEventListener('resize', () => { if (D) applyView(); });

/* ---------- время ---------- */
$('#slider').oninput = e => setT(+e.target.value);
$('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '❚❚' : '▶'; if (playing) { if (T >= D.horizon_h) setT(0); lastTs = 0; requestAnimationFrame(tick); } };
function tick(ts) {
  if (!playing) return;
  if (lastTs) setT(T + (ts - lastTs) / 1000 * 24 * +$('#speed').value);
  lastTs = ts;
  if (T >= D.horizon_h) { playing = false; $('#play').textContent = '▶'; return; }
  requestAnimationFrame(tick);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  if (e.key === 'ArrowRight') setT(T + 24); if (e.key === 'ArrowLeft') setT(T - 24);
  if (e.key === 'Escape') { sel = null; renderSide(); renderMap(); }
});

/* ---------- тема ---------- */
$('#themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('a3theme', r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('a3theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* ---------- приложение: сценарии и загрузка ---------- */
function busy(on, text) { $('#overlay').classList.toggle('on', on); if (text) $('#overlayText').textContent = text; }
async function api(path, opt) { const r = await fetch(path, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || r.statusText); return j; }
let jobSeq = 0;
async function runJob(body, label) {
  const my = ++jobSeq;
  busy(true, `Считаем «${label}»…`);
  try {
    const j = await api('/api/network/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (my !== jobSeq) return;
    const id = j.job_id;
    const fc = j.forecast;
    if (fc && fc.available && !fc.out_of_distribution && fc.expected_on_time_share) {
      const best = fc.strategy_to_run || Object.keys(fc.expected_on_time_share)[0];
      const iv = (fc.on_time_share_interval90 || {})[best];
      label += ` · нейросеть за ${Math.round(j.forecast_ms || 0)} мс: в срок ≈${Math.round(fc.expected_on_time_share[best] * 100)}%${iv ? ` (${Math.round(iv[0] * 100)}–${Math.round(iv[1] * 100)}%)` : ''}, матмодель уточняет`;
    }
    for (;;) {
      await new Promise(r => setTimeout(r, 700));
      if (my !== jobSeq) return;       // запущен другой расчёт — этот больше не показываем
      const s = await api(`/api/network/jobs/${id}`);
      if (s.status === 'done') break;
      if (s.status !== 'running') throw new Error(s.error || s.status);
      $('#overlayText').textContent = `${label} · ${Math.round(s.elapsed_s)} с`;
    }
    const data = await api(`/api/network/jobs/${id}/data`);
    if (my !== jobSeq) return;
    jobId = id; load(data); setStrategy(cur);
  } catch (e) { if (my === jobSeq) alert('Не удалось посчитать: ' + e.message); }
  finally { if (my === jobSeq) busy(false); }
}
async function initApp() {
  const sc = await api('/api/network/scenarios');
  const sel_ = $('#scenarioSel');
  const groups = [['network', 'Сеть рек · сетевое ядро'], ['linear', 'Одна река · матмодель и нейросеть']];
  sel_.innerHTML = groups.map(([k, n]) => `<optgroup label="${n}">${sc.builtin.filter(b => (b.kind || 'network') === k).map(b => `<option value="${esc(b.name)}">${esc(b.title)}</option>`).join('')}</optgroup>`).join('');
  const want = new URLSearchParams(location.search).get('scenario');
  if (want && sc.builtin.some(b => b.name === want)) sel_.value = want;
  sel_.hidden = false; $('#uploadBtn').hidden = false;
  sel_.onchange = () => { if (sel_.value !== '__upload') runJob({builtin: sel_.value}, sel_.selectedOptions[0].textContent); };
  $('#uploadBtn').onclick = () => { tab = 'upload'; $('#pane').innerHTML = uploadHTML(); renderTabs(); bindUpload(); };
  runJob({builtin: sel_.value}, sel_.selectedOptions[0].textContent);
}
function uploadHTML() {
  return `<h3>Свой сценарий</h3>
  <div class="drop" id="drop">Перетащите файлы сюда<br><span class="note">или нажмите, чтобы выбрать; имена файлов любые</span></div>
  <h3>Сеть рек</h3>
  <p class="note">Один JSON, как <code>data/yakutia/yakutia_network.json</code>: порты, участки с глубинами по дням, буксиры, баржи, заявки «откуда — куда». Можно добавить пределы поиска и тарифы. Порты из геоосновы Якутии встанут на свои места, остальные — схемой.</p>
  <p><a class="btn" href="/api/network/sample/yakutia" download="yakutia_network.json">Пример: Якутия</a> <a class="btn" href="/api/network/sample/demo" download="network_demo.json">Пример: порты A–D</a></p>
  <h3>Одна река</h3>
  <p class="note">Три CSV — <code>cargo</code>, <code>units</code>, <code>conditions</code> — и по желанию <code>config.json</code> с участками маршрута (без него — Нижнеянск — Усть-Куйга). Сначала придёт прогноз нейросети, затем расчёт матмодели.</p>
  <p><a class="btn" href="/api/sample/cargo.csv" download>cargo.csv</a> <a class="btn" href="/api/sample/units.csv" download>units.csv</a> <a class="btn" href="/api/sample/conditions.csv" download>conditions.csv</a> <a class="btn" href="/api/sample/config.json" download>config.json</a></p>`;
}
function bindUpload() {
  const drop = $('#drop'), inp = $('#fileIn');
  drop.onclick = () => inp.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); takeFiles(e.dataTransfer.files); };
  inp.onchange = () => takeFiles(inp.files);
}
function markUploaded(name) {
  const sel_ = $('#scenarioSel');
  let o = sel_.querySelector('option[value="__upload"]');
  if (!o) { o = document.createElement('option'); o.value = '__upload'; sel_.prepend(o); }
  o.textContent = 'Загружено: ' + name; sel_.value = '__upload';
}
async function takeFiles(files) {
  const body = {}, csv = {};
  for (const f of files) {
    const text = await f.text();
    const head = text.replace(/^\ufeff/, '').split(/\r?\n/, 1)[0].toLowerCase();
    if (!text.trim().startsWith('{')) {
      if (head.includes('cargo_id') && head.includes('due_date')) csv.cargo = text;
      else if (head.includes('unit_id')) csv.units = text;
      else if (head.includes('segment_id') && head.includes('usable_depth_m')) csv.conditions = text;
      else { alert(`${f.name}: не узнал файл. Нужны cargo / units / conditions (CSV) или JSON`); return; }
      continue;
    }
    let j; try { j = JSON.parse(text); } catch (e) { alert(`${f.name}: не JSON`); return; }
    if (j.segments && !j.edges) { csv.config = text; continue; }
    if (j.edges && j.cargo) body.scenario = j;
    else if (j.rates) body.tariffs = j;
    else if ('max_actions' in j || 'beam_width' in j) body.limits = j;
    else { alert(`${f.name}: не узнал файл (нужен сценарий с edges и cargo, limits или тарифы с rates)`); return; }
  }
  if (Object.keys(csv).length) {
    const miss = ['cargo', 'units', 'conditions'].filter(k => !csv[k]);
    if (miss.length) { alert('Для одной реки не хватает: ' + miss.join(', ')); return; }
    markUploaded('одна река');
    return runJob({files: csv}, 'свой сценарий одной реки');
  }
  if (!body.scenario) { alert('Нужен JSON сети (с полями edges и cargo) или три CSV одной реки'); return; }
  markUploaded(body.scenario.scenario_id || 'сеть');
  runJob(body, body.scenario.scenario_id || 'свой сценарий');
}

if (D0) load(D0); else if (APP) initApp().catch(e => { busy(false); alert(e.message); });
</script>
