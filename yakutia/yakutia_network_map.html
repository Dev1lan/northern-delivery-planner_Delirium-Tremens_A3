<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Северный завоз · сеть</title>
<style>
:root{
  color-scheme:light;
  --page:#eef1f4; --surface:#ffffff; --surface2:#f4f6f8; --border:#dde2e7; --grid:#e8ecf0;
  --text:#18212b; --text2:#4d5967; --muted:#6c7682;
  --land:#f4f5f6; --sea:#dde5ec; --coast:#b8c4cf; --river:#9fb8cf; --river-bg:#c9d6e2;
  --accent:#1d6fd8; --accent-soft:#e4eefb; --accent-ink:#fff; --signal:#c7860c; --signal-soft:#fbf1dc;
  --ok:var(--accent); --limit:var(--signal); --closed:#a3acb6; --bad:#cf3f35; --relief-op:.55; --pl0:#bcdcff; --pl1:#0b3f8f; --seaway:var(--accent);
  --load:var(--text2); --sail:var(--accent); --unload:var(--text2); --empty:var(--accent); --wait:var(--signal); --idle:#a3acb6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0e1318; --surface:#151b21; --surface2:#1b2229; --border:#29323b; --grid:#212931;
  --text:#e7ebef; --text2:#a4aeb9; --muted:#8b96a2;
  --land:#1a2027; --sea:#11161b; --coast:#2f3943; --river:#3c5872; --river-bg:#26374a;
  --accent:#4f9cf0; --accent-soft:#172a40; --accent-ink:#07111d; --signal:#e8a93a; --signal-soft:#33280f;
  --ok:var(--accent); --limit:var(--signal); --closed:#525d69; --bad:#f0675c; --relief-op:.5; --pl0:#a9cff7; --pl1:#1554b8; --seaway:var(--accent);
  --load:var(--text2); --sail:var(--accent); --unload:var(--text2); --empty:var(--accent); --wait:var(--signal); --idle:#525d69;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0e1318; --surface:#151b21; --surface2:#1b2229; --border:#29323b; --grid:#212931;
  --text:#e7ebef; --text2:#a4aeb9; --muted:#8b96a2;
  --land:#1a2027; --sea:#11161b; --coast:#2f3943; --river:#3c5872; --river-bg:#26374a;
  --accent:#4f9cf0; --accent-soft:#172a40; --accent-ink:#07111d; --signal:#e8a93a; --signal-soft:#33280f;
  --ok:var(--accent); --limit:var(--signal); --closed:#525d69; --bad:#f0675c; --relief-op:.5; --pl0:#a9cff7; --pl1:#1554b8; --seaway:var(--accent);
  --load:var(--text2); --sail:var(--accent); --unload:var(--text2); --empty:var(--accent); --wait:var(--signal); --idle:#525d69;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
/* верхняя панель */
.top{display:flex;align-items:center;gap:12px;padding:0 12px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--text);color:var(--surface);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:14px;line-height:1.15;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.spacer{flex:1}
.vsep{width:1px;align-self:stretch;margin:12px 2px;background:var(--border);flex:none}
.field{display:flex;align-items:center;gap:8px;min-width:0;flex:none}
.field.plan{flex:0 1 auto}
.field>.fl{font-size:12px;color:var(--muted);white-space:nowrap}
.field select.btn{max-width:340px;text-overflow:ellipsis;overflow:hidden;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;height:34px}
.btn svg{flex:none}
.btn.quiet{border-color:transparent;background:transparent;color:var(--text2)}
.btn.quiet:hover{background:var(--surface2);color:var(--text)}
.seg{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;border-radius:7px;padding:0 11px;height:28px;cursor:pointer;color:var(--text2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.seg button .star{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:6px 8px;min-width:32px}
select.btn{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
/* основная область */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--land)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.float{position:absolute;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.kpis{top:12px;left:12px;display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden;max-width:calc(100% - 90px)}
.kpirow{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
.kmode{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 10px;border-right:1px solid var(--border)}
.kmode .seg{flex-direction:column;align-items:stretch}
.kmode .seg button{height:24px;font-size:12.5px;justify-content:flex-start}
.kpi{padding:9px 16px;border-right:1px solid var(--border);min-width:0;flex:none}
.kpi.hero .v{font-size:28px;color:var(--accent)}
.kpi.link{cursor:pointer}.kpi.link:hover{background:var(--surface2)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;color:var(--muted);white-space:nowrap}
.kpi .v{font-size:22px;font-weight:650;line-height:1.2;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text2)}
.kpi .s{font-size:12.5px;color:var(--text2);white-space:nowrap}
.zoom{top:12px;right:12px;display:flex;flex-direction:column;padding:3px;gap:2px}
.zoom hr{border:0;border-top:1px solid var(--border);margin:2px 4px}
.zoom button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.zoom button{display:grid;place-items:center}
.zoom button{border:0;background:transparent;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;color:var(--text2)}
.zoom button:hover{background:var(--surface2)}
.legend{right:12px;bottom:34px;padding:10px 12px;font-size:13px;color:var(--text2);display:grid;gap:8px;max-width:300px}
.legend[hidden]{display:none}
.legend .hd{font-weight:600;color:var(--text);font-size:12.5px}
.legend .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.legend .row>span{white-space:nowrap}
.legend .grp{color:var(--muted);font-size:12.5px;grid-column:1/-1;margin-top:2px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .ln{width:20px;height:3px;border-radius:2px}
.layers{top:12px;right:56px;padding:10px 12px;display:grid;gap:6px;font-size:13px;min-width:210px}
.layers .hd{font-weight:600;font-size:13px}
.layers label{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.layers input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.layers small{color:var(--muted);font-size:12px;white-space:normal}
.subtabs{margin:0 0 12px}
.why{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0 4px;background:var(--surface2)}
.why p{margin:0 0 8px;font-size:13px;color:var(--text2)}
.why table{width:100%;border-collapse:collapse;font-size:13px}
.why th{font-weight:600;color:var(--muted);text-align:right;padding:3px 4px;font-size:12px}
.why th:first-child,.why td:first-child{text-align:left}
.why td{padding:4px;text-align:right;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.why td.up{color:var(--accent);font-weight:600}.why td.dn{color:var(--bad);font-weight:600}
.cmp .r .name{font-size:13.5px}.cmp .r .val{font-size:14px;font-weight:600}
.attrib{right:12px;bottom:8px;padding:3px 8px;font-size:11px;color:var(--muted);max-width:50%;border-radius:6px}
.tip{position:absolute;pointer-events:none;z-index:20;padding:8px 10px;font-size:12px;max-width:280px;display:none}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip .k{color:var(--muted)}
.tip .pfleet{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);display:grid;gap:3px}
/* шкала времени */
.timeline{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 14px 10px;background:var(--surface);border-top:1px solid var(--border)}
.date{font-weight:650;font-size:14px;min-width:120px}
.date small{display:block;font-weight:500;color:var(--muted);font-size:12px}
/* дата на шкале — кнопка с календарём: щелчок открывает выбор дня */
.datepick{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 8px;border:1px solid transparent;border-radius:8px;cursor:pointer;background:none;text-align:left}
.datepick:hover,.datepick[aria-expanded="true"]{border-color:var(--border);background:var(--surface2)}
.datepick svg{flex:none;color:var(--muted)}
.datepick:hover svg,.datepick[aria-expanded="true"] svg{color:var(--accent)}
/* свой календарь: открывается над шкалой (системный уходит вниз за край окна) */
.cal{position:absolute;left:56px;bottom:calc(100% + 6px);z-index:30;width:252px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600}
.cal-h button{border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--text2);font-size:16px}
.cal-h button:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.cal-h button:disabled{opacity:.3;cursor:default}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:11px;color:var(--muted);padding:2px 0}
.cal-g button{border:0;background:none;height:30px;border-radius:6px;cursor:pointer;color:var(--text);font-variant-numeric:tabular-nums}
.cal-g button:hover:not(:disabled){background:var(--surface2)}
.cal-g button:disabled{color:var(--muted);opacity:.4;cursor:default}
.cal-g button.today{box-shadow:inset 0 0 0 1px var(--border)}
.cal-g button[aria-current="date"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-g button:focus-visible,.cal-h button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.track{position:relative;height:42px}
#spark{position:absolute;inset:0 0 14px 0;width:100%;height:28px}
#slider{position:absolute;left:0;right:0;bottom:0;width:100%;margin:0;accent-color:var(--accent)}
.months{position:absolute;left:0;right:0;top:28px;height:0;font-size:11.5px;color:var(--muted)}
.months span{position:absolute;transform:translateX(-50%);top:-2px;pointer-events:none}
/* боковая панель */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);background:var(--surface);border-left:1px solid var(--border);min-height:0;min-width:0}
.tabs{display:flex;gap:0;padding:8px 6px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:8px 5px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs button .cnt{color:var(--muted);font-size:11px;margin-left:3px}
.pane{overflow:auto;padding:12px 14px 18px;min-height:0}
.pane h3{font-size:13px;color:var(--text);font-weight:600;margin:20px 0 8px}
.pane h3:first-child{margin-top:2px}
.note{color:var(--muted);font-size:12.5px}
.callout{border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--text2)}
.callout b{color:var(--text)}
.callout.warn{border-color:var(--border);border-left:3px solid var(--signal);background:var(--signal-soft)}
.callout.good{border-color:var(--border);border-left:3px solid var(--accent);background:var(--surface2)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);vertical-align:middle}
.badge.stub{background:color-mix(in srgb,var(--limit) 14%,var(--surface));border-color:color-mix(in srgb,var(--limit) 45%,var(--border));color:var(--text)}
.badge.ok{color:var(--ok)} .badge.bad{color:var(--bad)}
.cmp{display:grid;gap:7px}
.cmp .r{display:grid;grid-template-columns:104px minmax(0,1fr) 62px;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:6px}
.cmp .r:hover{background:var(--surface2)}
.cmp .r.on{background:var(--accent-soft)}
.cmp .name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .bar{height:10px;border-radius:5px;background:var(--grid);position:relative;overflow:hidden}
.cmp .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.cmp .bar i.tot{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.cmp .val{text-align:right;font-size:12px}
.list{display:grid;gap:4px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--surface2)}
.item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{font-size:12px;text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.prog{height:5px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:4px;display:flex}
.prog i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.card+.card{margin-top:10px}
.card .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card .hd b{font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.kv dd.na{color:var(--muted);font-style:italic}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--border)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--grid)}
table.t td.n,table.t th.n{text-align:right}
.fin{display:grid;gap:6px}
.fin .r{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12.5px}
.fin .bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.fin .bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:24px;font-weight:650;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.mini .l{font-size:11px;color:var(--muted)} .mini .v{font-size:16px;font-weight:650}
/* загрузка */
.drop{border:1.5px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--text2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--page) 60%,transparent);z-index:30}
.overlay.on{display:grid}
.overlay .box{padding:16px 20px;max-width:min(880px,94%);max-height:92%;overflow:auto}
.overlay .box .row{display:flex;gap:12px;align-items:center}
.overlay .fc{margin-top:12px}
.overlay .fc:empty{display:none}
.overlay .fc td small,.fcm td small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.overlay .fc th.best{color:var(--accent)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* карта */
.lbl{font-size:13.5px;fill:var(--text);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl.hub{font-weight:650}
.lbl.river{fill:var(--river);stroke:var(--land);font-style:italic;font-size:12px}
.lbl.sea{fill:color-mix(in srgb,var(--seaway) 65%,var(--muted));stroke:none;font-style:italic;letter-spacing:.12em;font-size:13px}
.pcnt{font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.vlbl{font-size:12px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
@media (max-width:1380px){.brand>div:last-child,.vsep:first-of-type{display:none}.btn.quiet#uploadBtn{font-size:0;gap:0;padding:0 9px}}
@media (max-width:1540px){.seg button small{display:none}}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr) 340px}.tabs button{font-size:12.5px;padding:8px 4px}}
@media (max-width:820px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .stage{height:72vh}
  .side{border-left:0;border-top:1px solid var(--border)}
  .top{flex-wrap:wrap}
  .kpis{order:-1;position:static;margin:0;border-radius:0;border-width:0 0 1px;max-width:none;overflow-x:auto;box-shadow:none}
  .kpi{padding:6px 10px;flex:none}.kpi .v{font-size:15px}
  .seg{max-width:100%;overflow-x:auto}
  .mapwrap{display:flex;flex-direction:column}
  #map{flex:1 1 0;min-height:0;height:auto}
  .legend{max-width:calc(100% - 70px)}
  .timeline{grid-template-columns:auto minmax(0,1fr) auto}.timeline .date{display:none}.datepick{padding:6px;gap:0}.cal{left:8px}
}
.wiform{display:grid;gap:8px;margin-top:10px}
.wi{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:12.5px}
.wi>span{color:var(--muted)}
.wi.wide{grid-template-columns:1fr}

function whyHTML() {

  const alt = D.order.filter(k => k !== cur).sort((x, y) => D.strategies[y].metrics.delivered_on_time_t - D.strategies[x].metrics.delivered_on_time_t)[0];

async function runWhatIf(body, change) {
  if (NET.busy) return;
  NET.busy = true; busy(true, 'Пересчитываем изменение…'); renderSide();
  const id = jobId;
  try {
    const r = await api(J('what-if'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...body, base: baseVariant()})});
    if (id !== jobId) return;
    NET.whatif.push({change: r.alternatives[0].change, report: r});
    addVariant(r.variant, r.view);
  } catch (e) { if (id === jobId) NET.whatif.push({change, error: e.message}); }
  finally { NET.busy = false; busy(false); if (id === jobId) renderSide(); }
}
function addVariant(key, view) {
  if (!view || D.strategies[key]) return;
  for (const f of view.extra_fleet || []) if (!fleetById(f.vessel_id)) D.fleet.push(f);
  D.strategies[key] = view; D.order.push(key);
  prepare(); renderTop(); setStrategy(cur);
}

async function compareExp(pair) {

/* ---------- управление картой ---------- */
let drag = null;
map.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, v: view.slice(), moved: false}; map.setPointerCapture(e.pointerId); });
map.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = scale(), dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  if (Math.abs(dx) + Math.abs(dy) > 2 * k) { drag.moved = true; map.classList.add('drag'); hideTip(); }
  view = clampView([drag.v[0] - dx, drag.v[1] - dy, view[2], view[3]]);
  want = view.slice();
  map.setAttribute('viewBox', view.join(' '));
});
map.addEventListener('pointerup', e => { if (drag && !drag.moved && e.target === map) { /* клик по пустому месту */ } drag = null; map.classList.remove('drag'); });
/* шаг зума пропорционален прокрутке: колесо мыши (~100 px за щелчок) — ~20 %, тачпад и щипок — плавно */
map.addEventListener('wheel', e => {
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const k = e.ctrlKey ? 0.006 : 0.0018;  // ctrlKey — щипок на тачпаде
  zoom(Math.exp(Math.max(-0.4, Math.min(0.4, dy * k))), e);
}, {passive: false});
function zoom(f, e) {
  const r = map.getBoundingClientRect();
  const px = e ? (e.clientX - r.left) / r.width : .5, py = e ? (e.clientY - r.top) / r.height : .5;
  if (!view || !fitBox) return;  // карта ещё не построена
  const r0 = map.getBoundingClientRect(), ar0 = r0.width / Math.max(1, r0.height);
  const maxW = 1.5 * Math.max(fitBox[2], fitBox[3] * ar0);  // дальше полутора «всей сети» не отдаляем
  const w = Math.min(maxW, Math.max(40, view[2] * f));
  if (w === view[2]) return;
  const ff = w / view[2];
  const h = view[3] * ff;
  view = clampView([view[0] + (view[2] - w) * px, view[1] + (view[3] - h) * py, w, h]);
  want = view.slice();
  map.setAttribute('viewBox', view.join(' '));
  placeLabels(); renderMap();
}
$('#zin').onclick = () => zoom(.7); $('#zout').onclick = () => zoom(1.4); $('#zfit').onclick = () => { want = fitBox.slice(); applyView(); };

    + `<div class="cal-g">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(w => `<span class="wd">${w}</span>`).join('')}${cells}</div>`;
}
function openCal(open) {
  if (open && !D) return;
  $('#cal').hidden = !open; $('#dateBtn').setAttribute('aria-expanded', open);
  if (!open) return;
  const d = at(T); calYM = [d.getFullYear(), d.getMonth()]; renderCal();
  ($('#cal [aria-current="date"]') || $('#cal .cal-g button:not(:disabled)'))?.focus();
}
$('#dateBtn').onclick = () => openCal($('#cal').hidden);
$('#cal').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.m) { const d = new Date(calYM[0], calYM[1] + +b.dataset.m, 1); calYM = [d.getFullYear(), d.getMonth()]; renderCal(); return; }
  /* выбранный день — на полдень (в 00:00 большинство рейсов ещё не начато) */
  if (playing) $('#play').click();
  setT((new Date(calYM[0], calYM[1], +b.dataset.d, 12) - t0()) / 3600e3);
  openCal(false); $('#dateBtn').focus();
};
document.addEventListener('pointerdown', e => { if (!$('#cal').hidden && !e.target.closest('#cal, #dateBtn')) openCal(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#cal').hidden) { openCal(false); $('#dateBtn').focus(); } }, true);
$('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '❚❚' : '▶'; if (playing) { if (T >= D.horizon_h) setT(0); lastTs = 0; requestAnimationFrame(tick); } };
function tick(ts) {
  if (!playing) return;
  if (lastTs) setT(T + (ts - lastTs) / 1000 * 24 * +$('#speed').value);
  lastTs = ts;
  if (T >= D.horizon_h) { playing = false; $('#play').textContent = '▶'; return; }
  requestAnimationFrame(tick);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' || e.target.tagName === 'SELECT') return;
  if (e.target.closest && e.target.closest('#cal')) return;  // в календаре пробел и стрелки — его собственные
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  if (e.key === 'ArrowRight') setT(T + 24); if (e.key === 'ArrowLeft') setT(T - 24);
  if (e.key === 'Escape') { sel = null; renderSide(); renderMap(); }
});

/* ---------- тема ---------- */
$('#themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('a3theme', r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('a3theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* ---------- приложение: сценарии и загрузка ---------- */
function busy(on, text) { $('#overlay').classList.toggle('on', on); if (text) $('#overlayText').textContent = text; if (!on || text) $('#overlayFc').innerHTML = ''; }
async function api(path, opt) { const r = await fetch(path, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || j.error || r.statusText); return j; }
let jobSeq = 0, netForecast = null;
const FC_SHORT = {NETWORK_REPOSITION: 'с перегоном', NETWORK_COST: 'по цене', NETWORK_SOCIAL: 'соцминимумы', NETWORK_GREEDY: 'жадная', NETWORK_FCFS: 'по очереди'};
function forecastLine(fc) {
  const top = Object.entries(fc.by_strategy).sort((a, b) => b[1].on_time_t - a[1].on_time_t).slice(0, 2);
  const ood = fc.status !== 'OK';
  return `прогноз ML за ${Math.round(fc.ms || 0)} мс: ${top.map(([k, v]) => `${FC_SHORT[k] || k} ≈${fmt(v.on_time_t / 1000)} тыс. т (${Math.round(v.on_time_share * 100)}%)`).join(', ')}${ood ? ' — сценарий крупнее обучающих, грубый ориентир' : ''}; ядро уточняет`;
}
/* все метрики прогноза: [ключ, подпись, делитель, знаков, лучше меньше] — ключи как в metrics / financial ядра */
const FC_ROWS = [
  ['delivered_on_time_t', 'В срок, т', 1, 0], ['delivered_total_t', 'Доставлено всего, т', 1, 0], ['undelivered_t', 'Недовоз, т', 1, 0],
  ['critical_on_time_t', 'Критичных в срок, т', 1, 0], ['completed_voyages', 'Рейсов', 1, 0], ['repositioning_voyages', 'Перегонов', 1, 0],
  ['loaded_km', 'Пробег с грузом, км', 1, 0], ['empty_km', 'Порожний пробег, км', 1, 0], ['tonne_km', 'Грузооборот, млн т·км', 1e6, 1],
  ['resource_busy_hours', 'Занятость флота, ч', 1, 0],
  ['total_cost', 'Стоимость, млн ₽', 1e6, 1], ['operating_cost', 'в т. ч. перевозка, млн ₽', 1e6, 1], ['cost_per_t_on_time', 'Цена тонны в срок, ₽', 1, 0],
  ['undelivered_penalty', 'в т. ч. цена недовоза, млн ₽', 1e6, 1], ['empty_transition_cost', 'Порожние переходы, млн ₽', 1e6, 1]];
const fcHas = fc => fc && fc.by_strategy && Object.values(fc.by_strategy).some(v => v.metrics);
function fcOodNote(fc) {
  return fc.status !== 'OK' ? ' <b>Сценарий выходит за обучающие данные</b> (' + esc((fc.outside_features || []).map(x => x.replace('f_', '')).join(', ')) + ') — это грубый ориентир, стратегия не рекомендуется.' : '';
}
/* пока ядро считает: таблица «метрика × стратегия» с интервалом ≈80% */
function forecastWaitHTML(fc) {
  const ks = Object.keys(fc.by_strategy).filter(k => fc.by_strategy[k].metrics);
  const rows = FC_ROWS.filter(([key]) => ks.some(k => fc.by_strategy[k].metrics[key])).map(([key, name, div, dec]) => `<tr><td>${name}</td>${ks.map(k => {
    const v = fc.by_strategy[k].metrics[key];
    return !v || v.value == null ? '<td class="n">—</td>' : `<td class="n num">${fmt(v.value / div, dec)}<small>${fmt(v.lo / div, dec)}–${fmt(v.hi / div, dec)}</small></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="callout" style="margin-bottom:8px"><b>Прогноз ML за ${Math.round(fc.ms || 0)} мс — оценка, не расчёт.</b> Мелким шрифтом — интервал, в который попадают ≈80% проверочных сценариев.${fcOodNote(fc)}${fc.money === 'SKIPPED_OTHER_TARIFFS' ? ' Деньги не оцениваются: тарифы отличаются от обучающих.' : ''} Точные числа и аудит даст ядро.</div>
  <table class="t"><tr><th></th>${ks.map(k => `<th class="n${k === fc.recommended ? ' best' : ''}">${esc(FC_SHORT[k] || k)}${k === fc.recommended ? ' ★' : ''}</th>`).join('')}</tr>${rows}</table>`;
}
/* после расчёта: прогноз против ядра по всем метрикам выбранной стратегии */
function forecastAllHTML(fc) {
  const f = fc.by_strategy[cur], s = D.strategies[cur];
  if (!f || !f.metrics || !s) return '';
  const fin = s.financial || {};
  const rows = FC_ROWS.filter(([key]) => f.metrics[key] && f.metrics[key].value != null).map(([key, name, div, dec]) => {
    const p = f.metrics[key], raw = key === 'operating_cost' ? opCost(fin) : key === 'undelivered_penalty' ? undCost(fin)
      : key === 'total_cost' ? (opCost(fin) == null ? null : opCost(fin) + (undCost(fin) || 0))
      : key === 'cost_per_t_on_time' ? (opCost(fin) == null ? null : (opCost(fin) + (undCost(fin) || 0)) / Math.max(1, s.metrics.delivered_on_time_t))
      : s.metrics[key] != null ? s.metrics[key] : fin[key];
    if (raw == null) return '';
    const a = Number(raw), inside = a >= p.lo - 1e-6 && a <= p.hi + 1e-6;
    return `<tr><td>${name}</td><td class="n num">${fmt(p.value / div, dec)}<small>${fmt(p.lo / div, dec)}–${fmt(p.hi / div, dec)}</small></td><td class="n num">${fmt(a / div, dec)}</td><td class="n"><span class="badge ${inside ? 'ok' : 'bad'}">${inside ? 'в интервале' : 'вне интервала'}</span></td></tr>`;
  }).join('');
  return `<h3>Все метрики: прогноз и ядро · ${esc(s.label)}</h3><table class="t fcm"><tr><td></td><td class="n note">прогноз</td><td class="n note">ядро</td><td></td></tr>${rows}</table>`;
}
function forecastHTML() {
  const fc = D && D._forecast;
  if (!fc) return '';
  const rows = D.order.filter(k => fc.by_strategy[k]).map(k => {
    // ошибка — в процентах спроса: у стратегий с малым тоннажем относительная ошибка «по себе» обманчиво велика
    const p = fc.by_strategy[k].on_time_t, a = D.strategies[k].metrics.delivered_on_time_t, err = (p - a) / (D._demand || 1);
    return `<tr><td>${esc(D.strategies[k].label)}</td><td class="n num">${fmt(p)} т</td><td class="n num">${fmt(a)} т</td><td class="n num" style="color:${Math.abs(err) <= 0.05 ? 'var(--ok)' : 'var(--signal)'}">${err >= 0 ? '+' : '−'}${fmt(Math.abs(err) * 100, 1)} п. п.</td></tr>`;
  }).join('');
  return `<h3>Прогноз ML до расчёта</h3><div class="callout" style="margin-bottom:8px">Сетевая модель (ml/network_ml) дала оценку за ${Math.round(fc.ms || 0)} мс, до запуска ядра.${fc.status !== 'OK' ? ' <b>Сценарий выходит за обучающие данные</b> (' + esc((fc.outside_features || []).map(x => x.replace('f_', '')).join(', ')) + ') — это грубый ориентир, стратегия не рекомендуется.' : fc.recommended ? ' Рекомендованная стратегия: ' + esc(FC_SHORT[fc.recommended] || fc.recommended) + '.' : ''} Итог и аудит — только ядро.</div>
  <table class="t"><tr><td></td><td class="n note">прогноз</td><td class="n note">ядро</td><td class="n note">ошибка, % спроса</td></tr>${rows}</table>` + forecastAllHTML(fc);
}
async function runJob(body, label) {
  const my = ++jobSeq;
  busy(true, `Считаем «${label}»…`);
  try {
    const j = await api('/api/network/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (my !== jobSeq) return;
    const id = j.job_id;
    const fc = j.forecast;
    netForecast = fc && fc.by_strategy ? {...fc, ms: j.forecast_ms} : null;
    if (netForecast) {
      $('#overlayText').textContent = label;
      if (fcHas(netForecast)) { $('#overlayFc').innerHTML = forecastWaitHTML(netForecast); label += ' · ядро считает'; }
      else label += ' · ' + forecastLine(netForecast);
    } else if (fc && fc.available && !fc.out_of_distribution && fc.expected_on_time_share) {
      const best = fc.strategy_to_run || Object.keys(fc.expected_on_time_share)[0];
      const iv = (fc.on_time_share_interval90 || {})[best];
      label += ` · нейросеть за ${Math.round(j.forecast_ms || 0)} мс: в срок ≈${Math.round(fc.expected_on_time_share[best] * 100)}%${iv ? ` (${Math.round(iv[0] * 100)}–${Math.round(iv[1] * 100)}%)` : ''}, матмодель уточняет`;
    }
    for (;;) {
      await new Promise(r => setTimeout(r, 700));
      if (my !== jobSeq) return;       // запущен другой расчёт — этот больше не показываем
      const s = await api(`/api/network/jobs/${id}`);
      if (s.status === 'done') break;
      if (s.status !== 'running') throw new Error(s.error || s.status);
      $('#overlayText').textContent = `${label} · ${Math.round(s.elapsed_s)} с`;
    }
    const data = await api(`/api/network/jobs/${id}/data`);
    if (my !== jobSeq) return;
    jobId = id; load(data); D._forecast = netForecast; setStrategy(cur);
  } catch (e) { if (my === jobSeq) alert('Не удалось посчитать: ' + e.message); }
  finally { if (my === jobSeq) busy(false); }
}
async function initApp() {
  const sc = await api('/api/network/scenarios');
  const sel_ = $('#scenarioSel');
  const groups = [['network', 'Сеть рек · сетевое ядро'], ['linear', 'Одна река · матмодель и нейросеть']];
  sel_.innerHTML = groups.map(([k, n]) => `<optgroup label="${n}">${sc.builtin.filter(b => (b.kind || 'network') === k).map(b => `<option value="${esc(b.name)}">${esc(b.title)}</option>`).join('')}</optgroup>`).join('');
  const want = new URLSearchParams(location.search).get('scenario');
  if (want && sc.builtin.some(b => b.name === want)) sel_.value = want;
  sel_.hidden = false;
  sel_.insertAdjacentHTML('beforeend', '<optgroup label="Свои данные"><option value="__new">Загрузить свои файлы…</option></optgroup>');
  let prevVal = sel_.value;
  sel_.onchange = () => {
    if (sel_.value === '__new') { sel_.value = prevVal; $('#uploadBtn').click(); return; }
    prevVal = sel_.value;
    if (sel_.value !== '__upload') runJob({builtin: sel_.value}, sel_.selectedOptions[0].textContent);
  };
  $('#uploadBtn').onclick = () => { tab = 'upload'; $('#pane').innerHTML = uploadHTML(); renderTabs(); bindUpload(); };
  runJob({builtin: sel_.value}, sel_.selectedOptions[0].textContent);
}
function uploadHTML() {
  return `<h3>Свой сценарий</h3>
  <div class="drop" id="drop">Перетащите файлы сюда<br><span class="note">или нажмите, чтобы выбрать; имена файлов любые</span></div>
  <h3>Сеть рек</h3>
  <p class="note">Один JSON, как <code>data/yakutia/yakutia_network.json</code>: порты, участки с глубинами по дням, буксиры, баржи, заявки «откуда — куда». Можно добавить пределы поиска и тарифы. Порты из геоосновы Якутии встанут на свои места, остальные — схемой.</p>
  <p><a class="btn" href="/api/network/sample/yakutia" download="yakutia_network.json">Пример: Якутия</a> <a class="btn" href="/api/network/sample/demo" download="network_demo.json">Пример: порты A–D</a></p>
  <h3>Одна река</h3>
  <p class="note">Три CSV — <code>cargo</code>, <code>units</code>, <code>conditions</code> — и по желанию <code>config.json</code> с участками маршрута (без него — Нижнеянск — Усть-Куйга). Сначала придёт прогноз нейросети, затем расчёт матмодели.</p>
  <p><a class="btn" href="/api/sample/cargo.csv" download>cargo.csv</a> <a class="btn" href="/api/sample/units.csv" download>units.csv</a> <a class="btn" href="/api/sample/conditions.csv" download>conditions.csv</a> <a class="btn" href="/api/sample/config.json" download>config.json</a></p>`;
}
function bindUpload() {
  const drop = $('#drop'), inp = $('#fileIn');
  drop.onclick = () => inp.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); takeFiles(e.dataTransfer.files); };
  inp.onchange = () => takeFiles(inp.files);
}
function markUploaded(name) {
  const sel_ = $('#scenarioSel');
  let o = sel_.querySelector('option[value="__upload"]');
  if (!o) { o = document.createElement('option'); o.value = '__upload'; sel_.prepend(o); }
  o.textContent = 'Загружено: ' + name; sel_.value = '__upload';
}
async function takeFiles(files) {
  const body = {}, csv = {};
  for (const f of files) {
    const text = await f.text();
    const head = text.replace(/^\ufeff/, '').split(/\r?\n/, 1)[0].toLowerCase();
    if (!text.trim().startsWith('{')) {
      if (head.includes('cargo_id') && head.includes('due_date')) csv.cargo = text;
      else if (head.includes('unit_id')) csv.units = text;
      else if (head.includes('segment_id') && head.includes('usable_depth_m')) csv.conditions = text;
      else { alert(`${f.name}: не узнал файл. Нужны cargo / units / conditions (CSV) или JSON`); return; }
      continue;
    }
    let j; try { j = JSON.parse(text); } catch (e) { alert(`${f.name}: не JSON`); return; }
    if (j.segments && !j.edges) { csv.config = text; continue; }
    if (j.edges && j.cargo) body.scenario = j;
    else if (j.rates) body.tariffs = j;
    else if ('max_actions' in j || 'beam_width' in j) body.limits = j;
    else { alert(`${f.name}: не узнал файл (нужен сценарий с edges и cargo, limits или тарифы с rates)`); return; }
  }
  if (Object.keys(csv).length) {
    const miss = ['cargo', 'units', 'conditions'].filter(k => !csv[k]);
    if (miss.length) { alert('Для одной реки не хватает: ' + miss.join(', ')); return; }
    markUploaded('одна река');
    return runJob({files: csv}, 'свой сценарий одной реки');
  }
  if (!body.scenario) { alert('Нужен JSON сети (с полями edges и cargo) или три CSV одной реки'); return; }
  markUploaded(body.scenario.scenario_id || 'сеть');
  runJob(body, body.scenario.scenario_id || 'свой сценарий');
}

if (D0) load(D0); else if (APP) initApp().catch(e => { busy(false); alert(e.message); });
